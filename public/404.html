<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | SS Safety Solutions</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #111827, #7f1d1d, #9a3412);
        color: #fff;
        padding: 24px;
      }

      .card {
        max-width: 640px;
        text-align: center;
        background: rgba(17, 24, 39, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        padding: 48px 32px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }

      h1 {
        font-size: clamp(3rem, 8vw, 5rem);
        margin: 0 0 16px;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.78);
        margin: 0 0 28px;
      }

      a {
        display: inline-block;
        text-decoration: none;
        color: #111827;
        background: #fff;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>The page you requested could not be found. Use the link below to return to the homepage.</p>
      <a href="/">Back to Home</a>
    </main>
  </body>
</html>
