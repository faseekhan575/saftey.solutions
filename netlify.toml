[[redirects]]
  from = "https://www.sssafetysolutions.pk/*"
  to = "https://sssafetysolutions.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sssafetysolutions.pk/*"
  to = "https://sssafetysolutions.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sssafetysolutions.pk/*"
  to = "https://sssafetysolutions.pk/:splat"
  status = 301
  force = true

# App transactional routes
[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/placeorder"
  to = "/index.html"
  status = 200

# Catch-all: Any unmatched route returns real 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security Headers & Caching Policies
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build]
  command = "npm run build"
  publish = "dist"
