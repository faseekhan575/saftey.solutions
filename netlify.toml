[[redirects]]
  from = "https://www.sssafetysolutions.pk/*"
  to = "https://sssafetysolutions.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sssafetysolutions.pk/*"
  to = "https://sssafetysolutions.pk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sssafetysolutions.pk/*"
  to = "https://sssafetysolutions.pk/:splat"
  status = 301
  force = true

# App transactional routes
[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/placeorder"
  to = "/index.html"
  status = 200

# Catch-all: Any unmatched route returns real 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[build]
  command = "npm run build"
  publish = "dist"
